apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-application
  labels:
    app: weather-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-application
  template:
    metadata:
      labels:
        app: weather-application
    spec:
      containers:
      - name: weather-application
        image: harshalr/weather-application:latest
        ports:
        - containerPort: 8080